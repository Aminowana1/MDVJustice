name: Build MDVJustice

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read project version
        id: project
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building MDVJustice $VERSION"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MDVJustice-${{ steps.project.outputs.version }}
          path: target/MDVJustice-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error
