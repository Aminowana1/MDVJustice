# ==========================================================
# MDVJustice 1.0.1 - MDVCRAFT
# Moderacion de chat + condenas mineras
# ==========================================================

database:
  file: justice.db

permissions:
  admin: 'mdvjustice.admin'
  chat-global-bypass: 'mdvjustice.chat.global.bypass'
  antispam-bypass: 'mdvjustice.chat.antispam.bypass'

# Sugerencias que aparecen al pulsar TAB en los comandos.
commands:
  tab-suggestions:
    chat-delays:
      - 'off'
      - '1s'
      - '3s'
      - '5s'
      - '10s'
      - '30s'
      - '1m'
    sanction-durations:
      - '10m'
      - '30m'
      - '1h'
      - '6h'
      - '12h'
      - '1d'
      - '3d'
      - '7d'
      - 'permanente'
    prison-points:
      - '100'
      - '250'
      - '500'
      - '1000'
      - '2500'
      - '5000'

# ==========================================================
# CHAT
# ==========================================================
chat:
  global-slow:
    # El valor real se puede cambiar con:
    # /justice chat lento <duracion|off>
    default-delay: '0s'

  # Slow individual aplicado manualmente:
  # /justice slowchat <jugador> <delay> <duracion>
  #
  # Si coinciden global + individual + antispam + prision,
  # se usa siempre el delay MAS ALTO.

  antispam:
    enabled: true

    # Mensajes iguales/normalizados consecutivos necesarios
    # para disparar el castigo automatico.
    repeated-message-threshold: 3

    # Cantidad maxima de mensajes dentro de la ventana.
    burst-message-count: 5
    burst-window-seconds: 4

    # Slow automatico al detectar spam.
    punishment-delay: '10s'
    punishment-duration: '30m'

    # Normalizacion del texto para detectar:
    # "HOLA", "hola", "hola!!!" como mensajes similares.
    normalize:
      lowercase: true
      strip-colors: true
      collapse-spaces: true
      strip-basic-punctuation: true

  mute:
    broadcast: true

# ==========================================================
# PRISION / CONDENAS
# ==========================================================
prison:
  enabled: true

  # Punto donde aparecen los castigados.
  # Se configura con /justice prision setspawn
  spawn:
    world: ''
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

  # Punto al que va el jugador al ser liberado.
  # Se configura con /justice prision setlibertad
  # Si world esta vacio, usa el spawn de release.fallback-world.
  release:
    world: ''
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0
    fallback-world: 'world5'

  # Region completa de la prision.
  # /justice prision pos1
  # /justice prision pos2
  region:
    world: ''
    pos1: {x: 0, y: 0, z: 0}
    pos2: {x: 0, y: 0, z: 0}

  # Slow propio de cualquier preso.
  chat-delay: '40s'

  # Durante estos ticks despues de autenticar, MDVJustice
  # revalida la ubicacion para ganarle a teleports tardios de nLogin.
  post-auth-lock-ticks: 60
  post-auth-lock-check-every-ticks: 5

  allowed-auth-commands:
    - login
    - l
    - log
    - register
    - reg

  restrictions:
    prevent-item-drop: true
    prevent-item-pickup: true
    prevent-container-open: true
    prevent-block-place: true
    prevent-outgoing-damage: true
    prevent-incoming-pvp: true
    prevent-death: true

  # Revalida el kit de los presos. Es util si otro plugin del lobby
  # intenta colocar objetos en la hotbar al cambiar de mundo.
  kit-guard-interval-ticks: 10

  kit:
    pickaxe:
      material: IRON_PICKAXE
      name: '&8Pico del Esclavo'
      lore:
        - '&7Herramienta entregada por MDVJustice.'
        - '&7No puede romperse ni conservarse fuera de la condena.'
      unbreakable: true
      slot: 0

    food:
      material: COOKED_BEEF
      name: '&8Racion del Esclavo'
      amount: 64
      # Slot 7 por defecto para no chocar con el Libro del Viajero/slot 8.
      # Puedes cambiarlo si tu lobby utiliza otro slot.
      slot: 7
      replenish-after-consume: true

  # Titulo visual de Minecraft al castigar/liberar.
  screen-titles:
    punish:
      enabled: true
      title: '&4&l¡ESCLAVIZADO!'
      subtitle: '&7Cumple tu condena trabajando en la mina.'
      fade-in: 10
      stay: 60
      fade-out: 20

    release:
      enabled: true
      title: '&a&l¡ERES LIBRE!'
      subtitle: '&7Has cumplido tu condena.'
      fade-in: 10
      stay: 60
      fade-out: 20

  # Integracion SIN API con MDVSocial.
  # Los comandos se ejecutan SIEMPRE desde consola.
  integrations:
    on-punish-console-commands:
      - 'mdvsocial title punish {player} esclavo'
    on-release-console-commands:
      - 'mdvsocial title unpunish {player}'

  progress:
    bossbar:
      enabled: true
      title: '&8⛏ &7Condena: &f{current}&7/&f{required} &8(&e{remaining} restantes&8)'
      color: RED
      style: SOLID

    actionbar:
      enabled: true
      # 14 ticks = 0.7 segundos.
      # Durante esos 14 ticks se vuelve a enviar CADA TICK.
      pulse-ticks: 14
      message: '&6+{gained} puntos &8| &e{current}&7/&e{required} &8| &7Faltan: &f{remaining}'

# ==========================================================
# MINA
# ==========================================================
mine:
  enabled: true

  # /justice mina pos1
  # /justice mina pos2
  region:
    # SEGURIDAD 1.0.1:
    # La mina NO existe para MDVJustice hasta definir pos1 Y pos2.
    # Al actualizar desde 1.0.0, vuelve a ejecutar ambos comandos una vez.
    configured: false
    pos1-set: false
    pos2-set: false
    world: ''
    pos1: {x: 0, y: 0, z: 0}
    pos2: {x: 0, y: 0, z: 0}

  # Regenera solamente espacios AIR de la mina.
  # Nunca reemplaza un bloque dentro del cuerpo de un jugador.
  regeneration:
    enabled: true
    interval-seconds: 30
    blocks-per-tick: 80
    skip-player-occupied-blocks: true

    # SEGURIDAD EXTRA: si por cualquier error la seleccion supera
    # este volumen, la regeneracion se aborta sin modificar el mundo.
    max-volume: 100000

  # Puede ser CUALQUIER bloque vanilla valido, no solamente minerales.
  # weight = frecuencia relativa (no hace falta que sume 100).
  # points = puntos que obtiene el preso al romperlo.
  #
  # Ejemplos:
  # DIORITE -> 2 puntos
  # OBSIDIAN -> 30 puntos
  blocks:
    STONE:
      weight: 60.0
      points: 1
    DIORITE:
      weight: 12.0
      points: 2
    ANDESITE:
      weight: 10.0
      points: 2
    GRANITE:
      weight: 8.0
      points: 2
    DEEPSLATE:
      weight: 5.0
      points: 3
    COAL_ORE:
      weight: 2.0
      points: 4
    IRON_ORE:
      weight: 1.5
      points: 6
    GOLD_ORE:
      weight: 0.7
      points: 10
    DIAMOND_ORE:
      weight: 0.3
      points: 20
    OBSIDIAN:
      weight: 0.5
      points: 30

